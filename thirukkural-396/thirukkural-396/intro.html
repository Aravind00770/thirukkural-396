<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>திருக்குறள் | Thirukkural Intro</title>

  <!-- Google Fonts - பொன் நிற எழுத்துரு மற்றும் தமிழ் எழுத்துரு -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+Tamil:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Cinzel', 'Noto Serif Tamil', serif;
    }

    /* அனிமேஷன் கொண்ட பின்னணிக் கொள்கலன் */
    .hero-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    /* பின்னணிப் படம் மற்றும் கென் பர்ன்ஸ் ஜூம் அனிமேஷன் */
    .hero-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('assets/images/thiruvalluvar_bg.jpg');
      background-size: cover;
      background-position: center;
      transform: scale(1.05);
      transition: transform 3s ease-out, filter 1.5s ease;
      animation: kenburns 20s infinite alternate ease-in-out;
    }

    @keyframes kenburns {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    /* படத்தின் மேல் இருக்கும் இருண்ட நிழல் (Overlay) */
    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 10, 5, 0.55);
      backdrop-filter: blur(2px);
      transition: opacity 1.5s ease, backdrop-filter 1.5s ease;
    }

    /* முகப்பு உள்ளடக்கப் பெட்டி */
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      color: #ffffff;
      padding: 20px;
      transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* தங்க நிற திருக்குறள் தலைப்பு */
    .hero-title {
      font-family: 'Noto Serif Tamil', serif;
      font-size: 4.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #fff7d6 0%, #ffd700 50%, #cca010 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0px 4px 20px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 215, 0, 0.4);
      margin-bottom: 12px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1.2s forwards 0.3s;
    }

    /* ஆங்கிலத் துணைத்தலைப்பு */
    .hero-subtitle {
      font-size: 1.1rem;
      letter-spacing: 6px;
      font-weight: 600;
      color: #e2d7c5;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      margin-bottom: 35px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1.2s forwards 0.6s;
    }

    /* BEGIN பொத்தான் */
    .begin-btn {
      display: inline-block;
      padding: 12px 42px;
      font-size: 0.95rem;
      font-family: 'Cinzel', serif;
      letter-spacing: 3px;
      color: #fceecb;
      text-decoration: none;
      background: rgba(20, 15, 10, 0.4);
      border: 1.5px solid rgba(243, 213, 140, 0.6);
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.4s ease;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1.2s forwards 0.9s;
    }

    .begin-btn:hover {
      background: rgba(212, 175, 55, 0.25);
      border-color: #ffd700;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
      transform: translateY(-2px) scale(1.03);
    }

    /* பொத்தானைச் சுற்றியுள்ள அசைவு (Pulse Effect) */
    .begin-btn::after {
      content: '';
      position: absolute;
      top: -4px; left: -4px; right: -4px; bottom: -4px;
      border-radius: 34px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      animation: pulse 2s infinite;
    }

    /* ஆரம்ப அனிமேஷன்கள் */
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.1); opacity: 0; }
    }

    /* BEGIN கிளிக் செய்த பிறகு நிகழும் மாற்றங்கள் (Revealed State) */
    .hero-container.active .hero-overlay {
      opacity: 0.15;
      backdrop-filter: blur(0px);
    }

    .hero-container.active .hero-content {
      opacity: 0;
      transform: scale(1.1);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="hero-container" id="hero">
    <!-- பின்னணிப் படம் -->
    <div class="hero-bg"></div>
    
    <!-- இருண்ட மேலடுக்கு (Dark Overlay) -->
    <div class="hero-overlay"></div>

    <!-- மைய உள்ளடக்கம் -->
    <div class="hero-content">
      <h1 class="hero-title">திருக்குறள்</h1>
      <p class="hero-subtitle">WISDOM THAT BLOOMS</p>
      <button class="begin-btn" id="beginBtn" onclick="startExperience()">BEGIN</button>
    </div>
  </div>

  <script>
    function startExperience() {
      const hero = document.getElementById('hero');
      hero.classList.add('active');

      // 1.5 விநாடிகளுக்குப் பிறகு அடுத்த பக்கத்திற்கு அழைத்துச் செல்ல
      setTimeout(() => {
        // உங்கள் பிரதான பக்க இணைப்பு
        window.location.href = "index.html";
      }, 1400);
    }
  </script>
</body>
</html>
